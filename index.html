<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#07060b" />
  <title>DEADSELL</title>
  <style>
    @font-face { font-family: 'Galmuri11'; src: url('./assets/fonts/Galmuri11.woff2') format('woff2'); font-display: block; }
    @font-face { font-family: 'Galmuri11'; font-weight: bold; src: url('./assets/fonts/Galmuri11-Bold.woff2') format('woff2'); font-display: block; }
    html, body { margin: 0; height: 100%; background: #07060b; overflow: hidden; overscroll-behavior: none; }
    body { touch-action: none; -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
    /* keep the playfield (and the HUD in its corners) out of the notch / rounded corners in landscape */
    canvas#game, canvas#screen { position: fixed; top: 0; bottom: 0; left: env(safe-area-inset-left, 0px); right: env(safe-area-inset-right, 0px);
      width: calc(100vw - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px)); height: 100vh; height: 100dvh; display: block; image-rendering: pixelated; }
    /* world layer (filters / CRT overlay) sits behind the transparent UI canvas, which takes all the input */
    canvas#screen { pointer-events: none; }
    #rotate { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; flex-direction: column; gap: 16px;
      background: #07060b; color: #cfe9ff; font: 16px 'Galmuri11', sans-serif; text-align: center; z-index: 10; }
    #rotate .phone { width: 34px; height: 58px; border: 3px solid #9fe8ff; border-radius: 6px; animation: rot 1.6s ease-in-out infinite; }
    @keyframes rot { 0%, 30% { transform: rotate(0deg); } 60%, 100% { transform: rotate(-90deg); } }
    @media (orientation: portrait) and (pointer: coarse) { #rotate { display: flex; } }
  </style>
  <script type="module" crossorigin src="./assets/index-D8POFiRv.js"></script>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="rotate"><div class="phone"></div><div>가로 화면으로 돌려주세요</div></div>
</body>
</html>
